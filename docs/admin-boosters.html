<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Starlight Card Management | Starlight Card Binder</title>
  <link rel="stylesheet" href="css/style.css?v=1.0.2">
  <link rel="stylesheet" href="css/shared-ui.css?v=1.6.16">
  <link rel="stylesheet" href="css/pages/admin-shell.css?v=1.0.0">
  <link rel="stylesheet" href="css/pages/admin-boosters.css?v=1.5.0">
  <link rel="stylesheet" href="css/avatar-frames.css?v=1.3.0">
  <link rel="stylesheet" href="css/qol-ui.css?v=94.2.8">
  <script src="js/browser-performance.js?v=1.0.0" defer></script>
</head>
<body class="admin-suite">
  <script src="js/embed-mode.js" type="module"></script>
  <div class="admin-suite-frame admin-suite-frame--wide">
    <nav class="admin-suite-crumb" id="adminCrumb" aria-label="Administration breadcrumb"></nav>
    <header class="admin-suite-header">
      <div>
        <h1>Starlight Card Management</h1>
        <p class="admin-suite-lead">Manage series, cards, booster packs, reward pools, and uploaded artwork from one organized workspace.</p>
      </div>
    </header>
    <p id="status" class="admin-status status">Loading Starlight Card Management…</p>
    <div class="admin-panel shell">
      <div id="app" class="hidden">
        <div class="top-grid" id="metrics"></div>
        <div class="tabs admin-tabs">
          <button class="active" data-tab="overview">Dashboard</button>
          <button data-tab="series">Series</button>
          <button data-tab="cards">Cards</button>
          <button data-tab="classifications">Categories &amp; Subcategories</button>
          <button data-tab="boosters">Booster Packs</button>
          <button data-tab="assets">Asset Library</button>
          <button data-tab="events">Events</button>
          <button data-tab="frames">Avatar Frames</button>
          <button data-tab="maintenance">Maintenance</button>
        </div>
        <section id="overviewTab"></section>
        <section id="seriesTab" class="hidden"></section>
        <section id="cardsTab" class="hidden"></section>
        <section id="classificationsTab" class="hidden"></section>
        <section id="boostersTab" class="hidden"></section>
        <section id="assetsTab" class="hidden"></section>
        <section id="eventsTab" class="hidden"></section>
        <section id="framesTab" class="hidden"></section>
        <section id="maintenanceTab" class="hidden"></section>
      </div>
    </div>
    <a class="admin-back-link" href="admin-hub.html">Return to Administration Hub</a>
  </div>
  <div id="editor" class="st-dialog-overlay editor hidden" aria-hidden="true">
    <section class="st-dialog st-dialog--xl editor-card" role="dialog" aria-modal="true" aria-labelledby="editorTitle" tabindex="-1">
      <div class="editor-head">
        <h2 id="editorTitle">Editor</h2>
        <button id="closeEditor" class="st-dialog-close" type="button" data-st-modal-close aria-label="Close">×</button>
      </div>
      <div id="editorBody"></div>
    </section>
  </div>
  <script type="module" src="js/pages/admin-boosters-page.js?v=1.9.1"></script>
  <script src="js/shared-ui.js?v=1.6.16"></script>
  <script src="js/qol-ui.js?v=94.2.8" defer></script>
</body>
</html>
