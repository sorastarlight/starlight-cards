<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<title>Card Gallery | Starlight Card Binder</title>
<link href="css/style.css?v=1.0.3" rel="stylesheet"/>
<link href="css/v80-8-ui.css" rel="stylesheet"/>
<link href="css/app-shell.css?v=1.6.41" rel="stylesheet"/>
<link href="css/starlight-chrome.css?v=1.2.33" rel="stylesheet"/>
<link href="css/card-filters.css?v=1.1.4" rel="stylesheet"/>
<link href="css/pages/card-gallery-page.css?v=2.4.0" rel="stylesheet"/>
<link href="css/card-view-transition.css?v=1.0.0" rel="stylesheet"/>
<script src="js/browser-performance.js?v=1.0.0" defer></script>
<link rel="stylesheet" href="css/shared-ui.css?v=1.6.22">
<link rel="stylesheet" href="css/qol-ui.css?v=94.2.16">
<link rel="stylesheet" href="css/pages/card-analyzer.css?v=2.4.7">
<link rel="stylesheet" href="css/card-png-lightbox.css?v=1.0.2">
</head>
<body class="unified-shell shell-masthead-layout" data-page="binder">
<div class="sky"></div>

<header class="shell-masthead" id="shellMasthead">
  <div class="shell-masthead-inner">
    <a class="brand shell-masthead-brand" href="binder?view=home" data-shell-view="home" aria-label="Go to Home">
      <span class="shell-brand-lockup">
        <img alt="Sora Starlight" class="logo" src="site_assets/sora-starlight-header-logo.png?v=2" width="332" height="40" decoding="async"/>
        <span class="binder-ribbon">Collectible Card Hub</span>
      </span>
    </a>
    <nav class="shell-masthead-nav" aria-label="Primary"></nav>
    <div class="shell-masthead-actions">
      <button aria-label="Open navigation" class="shell-menu-button" id="shellMenuButton" type="button">☰</button>
      <div class="shell-account-menu-wrap">
        <button type="button" class="shell-account-menu-button" id="shellAccountMenuButton" aria-label="Account menu" aria-expanded="false" aria-haspopup="menu" aria-controls="shellAccountMenu">
          <span class="shell-avatar is-placeholder" data-shell-avatar="" aria-hidden="true"><svg class="shell-avatar-silhouette" viewBox="0 0 40 40" width="22" height="22" focusable="false"><circle cx="20" cy="14" r="7" fill="currentColor"/><path d="M8 33c1.8-7.2 6.4-10.5 12-10.5S30.2 25.8 32 33" fill="currentColor"/></svg></span>
        </button>
        <div class="shell-account-menu" id="shellAccountMenu" role="menu" hidden>
          <div class="shell-account-menu-summary" data-shell-signed-in hidden>
            <strong class="shell-account-menu-name" data-shell-account-name="">Loading collector…</strong>
            <span class="shell-account-menu-handle" data-shell-account-sub="">Starlight account</span>
            <div class="shell-profile-mini-stats" aria-label="Collector stats">
              <span class="shell-account-stat">Lv. <b data-collector-level="">1</b></span>
              <span class="shell-account-stat shell-star-bits-stat"><img class="star-bit-icon star-bit-icon--xs" src="site_assets/icons/star-bit.png?v=2" alt="" width="14" height="14" decoding="async"> <b data-star-bits="">0</b></span>
            </div>
          </div>
          <div class="shell-account-menu-signed-in" data-shell-signed-in hidden>
            <a role="menuitem" class="shell-profile-link" data-shell-profile-link="" href="binder?view=profile">View My Profile</a>
            <a role="menuitem" data-shell-view="profile" href="binder?view=profile">Profile Settings</a>
            <a role="menuitem" data-shell-view="notifications" href="binder?view=notifications">Notifications<span class="shell-nav-badge" data-notification-badge hidden>0</span></a>
          </div>
          <div class="shell-account-menu-tools">
            <button type="button" role="menuitem" class="shell-account-sfx shell-sfx-button sfx-toggle on" id="sfxToggle" aria-pressed="true" title="Turn sound effects on or off">
              <span class="shell-account-sfx-icon" aria-hidden="true">♪</span>
              <span class="shell-account-sfx-label">Sound effects</span>
              <span class="shell-account-sfx-state" data-shell-sfx-state>On</span>
            </button>
          </div>
          <div class="shell-account-menu-signed-out" data-shell-signed-out hidden>
            <a role="menuitem" data-shell-auth="signin" href="binder?view=login&amp;mode=signin">Sign In</a>
            <a role="menuitem" data-shell-auth="signup" href="binder?view=login&mode=signup">Register</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="site">
<aside class="sidebar shell-drawer" id="shellDrawer" aria-label="Site menu">
<a class="brand shell-sidebar-brand" href="binder?view=home" data-shell-view="home" aria-label="Go to Home">
  <img alt="Sora Starlight" class="logo" src="site_assets/sora-starlight-header-logo.png?v=2" width="240" height="29" decoding="async"/>
  <span class="binder-ribbon">Collectible Card Hub</span>
</a>
<nav aria-label="Main navigation" class="unified-nav"></nav>
</aside>
<div class="shell-drawer-backdrop" id="shellDrawerBackdrop" hidden></div>
<main class="main">
<section class="shell-event-banner" data-shell-event-banner hidden><div><span class="shell-event-kicker">Current Starlight Event</span><strong data-shell-event-name></strong><span data-shell-event-time></span></div><a data-shell-view="events" href="binder?view=events">View Event ✨</a></section>

<div class="shell-native-view" id="binderNativeView">
  <div class="card-gallery-page">
    <h1 class="visually-hidden">Card Gallery</h1>
    <div class="card-gallery-toolbar" id="seriesHeroToolbar" hidden></div>
    <section class="card-filter-panel panel" data-card-filter-context="binder" aria-label="Filter gallery cards"></section>
    <section class="card-gallery-stage panel" id="seriesGridStage" aria-label="Starlight card gallery"></section>
  </div>
</div>

<section aria-live="polite" class="shell-view-frame" id="shellViewFrame"><iframe id="shellViewIframe" title="Starlight Binder view"></iframe></section>
</main>
</div>

<footer aria-label="Live activity" class="shell-live-strip shell-live-strip-bottom" id="shellLiveStrip">
  <aside class="shell-live-feed is-collapsed" id="shellLiveFeed" aria-label="Live collector activity feed">
    <div class="shell-live-feed-body" data-live-feed-body>
      <div class="shell-live-feed-list" data-live-feed-list></div>
    </div>
    <div class="shell-live-feed-head">
      <div class="shell-live-feed-title">
        <span class="shell-live-feed-pulse" aria-hidden="true"></span>
        <strong>LIVE</strong>
        <span class="shell-live-feed-state" data-live-feed-status>Connecting</span>
      </div>
      <div class="shell-live-feed-ticker-wrap" data-live-feed-ticker aria-live="polite"></div>
      <div class="shell-live-feed-controls">
        <a class="shell-live-feed-open" href="binder?view=feed" data-shell-view="feed" data-live-feed-open>Open</a>
        <button type="button" class="shell-live-feed-toggle" data-live-feed-toggle aria-expanded="false" aria-label="Expand live feed">▴</button>
      </div>
    </div>
  </aside>
</footer>

<div aria-hidden="true" aria-live="polite" id="cardOverlay" hidden></div>
<script src="js/cloud-collection.js?v=1.4.2" type="module"></script>
<script src="js/site-dashboard.js?v=1.2" type="module"></script>
<script src="js/pages/binder-page.js?v=1.0"></script>
<script src="js/app-shell.js?v=1.8.13" type="module"></script>
<script src="js/card-tile.js?v=1.0.0"></script>
<script src="js/binder-theme-config.js?v=1.0.0"></script>
<script src="js/starlight-perspective-card.js?v=1.0.0"></script>
<script type="module" src="js/card-png-lightbox.js?v=1.0.2"></script>
<script src="js/shared-ui.js?v=1.6.22"></script>
<script src="js/qol-ui.js?v=94.2.13" defer></script>
</body>
</html>
